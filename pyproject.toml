[project]
name = "inferlab"
version = "0.1.0"
description = "Self-hosted, latency-optimized inference service for structured invoice extraction"
requires-python = ">=3.11,<3.12"

[project.scripts]
inferlab = "cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
